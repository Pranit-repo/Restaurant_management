services:
  - type: web
    name: restaurant-pos-backend
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm --filter @nodedr-restaurant/backend start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: restaurant-pos-db
    databaseName: nodedr_restaurant
    user: nodedr
    plan: free
